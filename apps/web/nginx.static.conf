# Serve one static Cortex frontend surface behind the host-routing edge proxy.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /cortex-runtime-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
