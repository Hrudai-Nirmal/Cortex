services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: cortex
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - cortex-postgres:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:0.9.6
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:11434/api/tags >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - cortex-ollama:/root/.ollama

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      CORTEX_DATABASE_URL: postgresql+asyncpg://cortex:cortex@postgres:5432/cortex
      CORTEX_OLLAMA_BASE_URL: http://ollama:11434
      CORTEX_ALLOW_REMOTE_MODEL_ENDPOINT: "false"
      CORTEX_OBJECT_STORAGE_ROOT: /var/lib/cortex/object-storage
      CORTEX_AUTH_MODE: fixture
      CORTEX_CONSOLE_HOST: cortex-console.hrudainirmal.in
      CORTEX_QUERY_HOST: cortex-app.hrudainirmal.in
      CORTEX_CONSOLE_PUBLIC_URL: https://cortex-console.hrudainirmal.in
      CORTEX_QUERY_PUBLIC_URL: https://cortex-app.hrudainirmal.in
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - cortex-object-storage:/var/lib/cortex/object-storage

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      CORTEX_DATABASE_URL: postgresql+asyncpg://cortex:cortex@postgres:5432/cortex
      CORTEX_OLLAMA_BASE_URL: http://ollama:11434
      CORTEX_ALLOW_REMOTE_MODEL_ENDPOINT: "false"
      CORTEX_OBJECT_STORAGE_ROOT: /var/lib/cortex/object-storage
      CORTEX_AUTH_MODE: fixture
      CORTEX_CONSOLE_HOST: cortex-console.hrudainirmal.in
      CORTEX_QUERY_HOST: cortex-app.hrudainirmal.in
      CORTEX_CONSOLE_PUBLIC_URL: https://cortex-console.hrudainirmal.in
      CORTEX_QUERY_PUBLIC_URL: https://cortex-app.hrudainirmal.in
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - cortex-object-storage:/var/lib/cortex/object-storage

  console-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.console
      args:
        VITE_CORTEX_CONSOLE_PUBLIC_URL: https://cortex-console.hrudainirmal.in
        VITE_CORTEX_QUERY_PUBLIC_URL: https://cortex-app.hrudainirmal.in
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  query-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.query
      args:
        VITE_CORTEX_CONSOLE_PUBLIC_URL: https://cortex-console.hrudainirmal.in
        VITE_CORTEX_QUERY_PUBLIC_URL: https://cortex-app.hrudainirmal.in
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  edge:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    environment:
      CORTEX_CONSOLE_HOST: cortex-console.hrudainirmal.in
      CORTEX_QUERY_HOST: cortex-app.hrudainirmal.in
    depends_on:
      api:
        condition: service_healthy
      console-web:
        condition: service_healthy
      query-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "80:8080"

volumes:
  cortex-postgres:
  cortex-ollama:
  cortex-object-storage:
