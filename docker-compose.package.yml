services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${CORTEX_POSTGRES_DB:-cortex}
      POSTGRES_USER: ${CORTEX_POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${CORTEX_POSTGRES_PASSWORD:-cortex}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CORTEX_POSTGRES_USER:-cortex} -d ${CORTEX_POSTGRES_DB:-cortex}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - cortex-postgres:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:0.30.10
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - cortex-ollama:/root/.ollama

  api:
    image: cortex-api:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      CORTEX_ENVIRONMENT: ${CORTEX_ENVIRONMENT:-production}
      CORTEX_DEV_MODE: ${CORTEX_DEV_MODE:-false}
      CORTEX_DATABASE_URL: ${CORTEX_DATABASE_URL:-postgresql+asyncpg://cortex:cortex@postgres:5432/cortex}
      CORTEX_OLLAMA_BASE_URL: ${CORTEX_OLLAMA_BASE_URL:-http://ollama:11434}
      CORTEX_ALLOW_REMOTE_MODEL_ENDPOINT: ${CORTEX_ALLOW_REMOTE_MODEL_ENDPOINT:-false}
      CORTEX_OBJECT_STORAGE_ROOT: ${CORTEX_OBJECT_STORAGE_ROOT:-/var/lib/cortex/object-storage}
      CORTEX_AUTH_MODE: ${CORTEX_AUTH_MODE:-fixture}
      CORTEX_REQUIRED_ACCELERATOR: ${CORTEX_REQUIRED_ACCELERATOR:-cpu}
      CORTEX_CONSOLE_HOST: ${CORTEX_CONSOLE_HOST:-cortex-console.hrudainirmal.in}
      CORTEX_QUERY_HOST: ${CORTEX_QUERY_HOST:-cortex-app.hrudainirmal.in}
      CORTEX_CONSOLE_PUBLIC_URL: ${CORTEX_CONSOLE_PUBLIC_URL:-https://cortex-console.hrudainirmal.in}
      CORTEX_QUERY_PUBLIC_URL: ${CORTEX_QUERY_PUBLIC_URL:-https://cortex-app.hrudainirmal.in}
      CORTEX_GENERATOR_MODEL: ${CORTEX_GENERATOR_MODEL:-qwen3:1.7b}
      CORTEX_EMBEDDING_MODEL: ${CORTEX_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - cortex-object-storage:/var/lib/cortex/object-storage

  worker:
    image: cortex-worker:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      CORTEX_ENVIRONMENT: ${CORTEX_ENVIRONMENT:-production}
      CORTEX_DEV_MODE: ${CORTEX_DEV_MODE:-false}
      CORTEX_DATABASE_URL: ${CORTEX_DATABASE_URL:-postgresql+asyncpg://cortex:cortex@postgres:5432/cortex}
      CORTEX_OLLAMA_BASE_URL: ${CORTEX_OLLAMA_BASE_URL:-http://ollama:11434}
      CORTEX_ALLOW_REMOTE_MODEL_ENDPOINT: ${CORTEX_ALLOW_REMOTE_MODEL_ENDPOINT:-false}
      CORTEX_OBJECT_STORAGE_ROOT: ${CORTEX_OBJECT_STORAGE_ROOT:-/var/lib/cortex/object-storage}
      CORTEX_AUTH_MODE: ${CORTEX_AUTH_MODE:-fixture}
      CORTEX_REQUIRED_ACCELERATOR: ${CORTEX_REQUIRED_ACCELERATOR:-cpu}
      CORTEX_CONSOLE_HOST: ${CORTEX_CONSOLE_HOST:-cortex-console.hrudainirmal.in}
      CORTEX_QUERY_HOST: ${CORTEX_QUERY_HOST:-cortex-app.hrudainirmal.in}
      CORTEX_CONSOLE_PUBLIC_URL: ${CORTEX_CONSOLE_PUBLIC_URL:-https://cortex-console.hrudainirmal.in}
      CORTEX_QUERY_PUBLIC_URL: ${CORTEX_QUERY_PUBLIC_URL:-https://cortex-app.hrudainirmal.in}
      CORTEX_GENERATOR_MODEL: ${CORTEX_GENERATOR_MODEL:-qwen3:1.7b}
      CORTEX_EMBEDDING_MODEL: ${CORTEX_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - cortex-object-storage:/var/lib/cortex/object-storage

  console-web:
    image: cortex-console-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile.console
      args:
        VITE_CORTEX_CONSOLE_PUBLIC_URL: ${CORTEX_CONSOLE_PUBLIC_URL:-https://cortex-console.hrudainirmal.in}
        VITE_CORTEX_QUERY_PUBLIC_URL: ${CORTEX_QUERY_PUBLIC_URL:-https://cortex-app.hrudainirmal.in}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  query-web:
    image: cortex-query-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile.query
      args:
        VITE_CORTEX_CONSOLE_PUBLIC_URL: ${CORTEX_CONSOLE_PUBLIC_URL:-https://cortex-console.hrudainirmal.in}
        VITE_CORTEX_QUERY_PUBLIC_URL: ${CORTEX_QUERY_PUBLIC_URL:-https://cortex-app.hrudainirmal.in}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  edge:
    image: cortex-edge:latest
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    environment:
      CORTEX_CONSOLE_HOST: ${CORTEX_CONSOLE_HOST:-cortex-console.hrudainirmal.in}
      CORTEX_QUERY_HOST: ${CORTEX_QUERY_HOST:-cortex-app.hrudainirmal.in}
    depends_on:
      api:
        condition: service_healthy
      console-web:
        condition: service_healthy
      query-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "${CORTEX_EDGE_PORT:-80}:8080"

  migrate:
    image: cortex-api:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment:
      CORTEX_ENVIRONMENT: ${CORTEX_ENVIRONMENT:-production}
      CORTEX_DEV_MODE: ${CORTEX_DEV_MODE:-false}
      CORTEX_DATABASE_URL: ${CORTEX_DATABASE_URL:-postgresql+asyncpg://cortex:cortex@postgres:5432/cortex}
      CORTEX_OLLAMA_BASE_URL: ${CORTEX_OLLAMA_BASE_URL:-http://ollama:11434}
      CORTEX_ALLOW_REMOTE_MODEL_ENDPOINT: ${CORTEX_ALLOW_REMOTE_MODEL_ENDPOINT:-false}
      CORTEX_OBJECT_STORAGE_ROOT: ${CORTEX_OBJECT_STORAGE_ROOT:-/var/lib/cortex/object-storage}
      CORTEX_AUTH_MODE: ${CORTEX_AUTH_MODE:-fixture}
      CORTEX_REQUIRED_ACCELERATOR: ${CORTEX_REQUIRED_ACCELERATOR:-cpu}
      CORTEX_CONSOLE_HOST: ${CORTEX_CONSOLE_HOST:-cortex-console.hrudainirmal.in}
      CORTEX_QUERY_HOST: ${CORTEX_QUERY_HOST:-cortex-app.hrudainirmal.in}
      CORTEX_CONSOLE_PUBLIC_URL: ${CORTEX_CONSOLE_PUBLIC_URL:-https://cortex-console.hrudainirmal.in}
      CORTEX_QUERY_PUBLIC_URL: ${CORTEX_QUERY_PUBLIC_URL:-https://cortex-app.hrudainirmal.in}
      CORTEX_GENERATOR_MODEL: ${CORTEX_GENERATOR_MODEL:-qwen3:1.7b}
      CORTEX_EMBEDDING_MODEL: ${CORTEX_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cortex-postgres:
  cortex-ollama:
  cortex-object-storage:
