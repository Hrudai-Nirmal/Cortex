services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: cortex
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - cortex-postgres:/var/lib/postgresql/data
  ollama:
    image: ollama/ollama:0.30.10
    ports:
      - "11434:11434"
    volumes:
      - cortex-ollama:/root/.ollama

volumes:
  cortex-postgres:
  cortex-ollama:
