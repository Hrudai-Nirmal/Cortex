apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
data:
  CORTEX_ENVIRONMENT: production
  CORTEX_DEV_MODE: "false"
  CORTEX_AUTH_MODE: fixture
  CORTEX_ALLOW_REMOTE_MODEL_ENDPOINT: "false"
  CORTEX_REQUIRED_ACCELERATOR: cpu
  CORTEX_OBJECT_STORAGE_ROOT: /var/lib/cortex/object-storage
  CORTEX_CONSOLE_HOST: cortex-console.example.com
  CORTEX_QUERY_HOST: cortex-app.example.com
  CORTEX_CONSOLE_PUBLIC_URL: https://cortex-console.example.com
  CORTEX_QUERY_PUBLIC_URL: https://cortex-app.example.com
  CORTEX_GENERATOR_MODEL: qwen3:14b
  CORTEX_EMBEDDING_MODEL: qwen3-embedding:0.6b
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cortex-object-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cortex-migrate
spec:
  template:
    metadata:
      labels:
        app: cortex-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: cortex/api:local
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: cortex-config
            - secretRef:
                name: cortex-secrets
          volumeMounts:
            - name: cortex-object-storage
              mountPath: /var/lib/cortex/object-storage
      volumes:
        - name: cortex-object-storage
          persistentVolumeClaim:
            claimName: cortex-object-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-api
  template:
    metadata:
      labels:
        app: cortex-api
    spec:
      containers:
        - name: api
          image: cortex/api:local
          envFrom:
            - configMapRef:
                name: cortex-config
            - secretRef:
                name: cortex-secrets
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: cortex-object-storage
              mountPath: /var/lib/cortex/object-storage
      volumes:
        - name: cortex-object-storage
          persistentVolumeClaim:
            claimName: cortex-object-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-worker
  template:
    metadata:
      labels:
        app: cortex-worker
    spec:
      containers:
        - name: worker
          image: cortex/worker:local
          envFrom:
            - configMapRef:
                name: cortex-config
            - secretRef:
                name: cortex-secrets
          command: ["python", "-m", "cortex.worker"]
          volumeMounts:
            - name: cortex-object-storage
              mountPath: /var/lib/cortex/object-storage
      volumes:
        - name: cortex-object-storage
          persistentVolumeClaim:
            claimName: cortex-object-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-console-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-console-web
  template:
    metadata:
      labels:
        app: cortex-console-web
    spec:
      containers:
        - name: console-web
          image: cortex/console-web:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
            failureThreshold: 4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-query-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortex-query-web
  template:
    metadata:
      labels:
        app: cortex-query-web
    spec:
      containers:
        - name: query-web
          image: cortex/query-web:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-api
spec:
  selector:
    app: cortex-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-console-web
spec:
  selector:
    app: cortex-console-web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-query-web
spec:
  selector:
    app: cortex-query-web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortex-ingress
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Proto $scheme;
spec:
  ingressClassName: nginx
  rules:
    - host: cortex-console.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: cortex-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: cortex-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortex-console-web
                port:
                  number: 80
    - host: cortex-app.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: cortex-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: cortex-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortex-query-web
                port:
                  number: 80
